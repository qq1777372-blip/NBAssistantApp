name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Capacitor project
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build unsigned device application
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name "*.app" -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/NBAssistant.app"

          cd "$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent Payload NBAssistant-unsigned.ipa
          shasum -a 256 NBAssistant-unsigned.ipa > NBAssistant-unsigned.ipa.sha256
          ls -lh NBAssistant-unsigned.ipa NBAssistant-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NBAssistant-unsigned-ipa
          path: |
            NBAssistant-unsigned.ipa
            NBAssistant-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
